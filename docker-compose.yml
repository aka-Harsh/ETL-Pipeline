version: '3.8'

services:
  # ─── Frontend ───
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8080
    networks:
      - flowforge-net

  # ─── Backend API ───
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flowforge
      - SPRING_DATASOURCE_USERNAME=flowforge
      - SPRING_DATASOURCE_PASSWORD=flowforge
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=flowforge
      - SPRING_RABBITMQ_PASSWORD=flowforge
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=eu-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AI_API_URL=http://ollama:11434/api/generate
      - AI_MODEL=phi3:mini
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - FLINK_REST_URL=http://flink-jobmanager:8081
      - FLINK_JARS_DIR=/app/flink-jars
    volumes:
      - flink_jars:/app/flink-jars
    networks:
      - flowforge-net

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=flowforge
      - POSTGRES_USER=flowforge
      - POSTGRES_PASSWORD=flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowforge-net

  # ─── Apache Kafka (KRaft, no Zookeeper) ───
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - flowforge-net

  # ─── Apache Flink (JobManager + TaskManager) ───
  flink-jobmanager:
    image: flink:1.18-java17
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        rest.bind-address: 0.0.0.0
    volumes:
      - flink_jars:/opt/flink/jars
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - flowforge-net

  flink-taskmanager:
    image: flink:1.18-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks:
      - flowforge-net

  # ─── RabbitMQ ───
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=flowforge
      - RABBITMQ_DEFAULT_PASS=flowforge
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowforge-net

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowforge-net

  # ─── LocalStack (S3 + DynamoDB) ───
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEFAULT_REGION=eu-west-2
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - flowforge-net

  # ─── Flink JAR builder (one-shot) ───
  flink-jar-builder:
    image: maven:3.9-eclipse-temurin-17-alpine
    working_dir: /build
    volumes:
      - ./flink-jobs:/build
      - maven_cache:/root/.m2
      - flink_jars:/output
    command: >
      sh -c "mvn package -DskipTests -q &&
             cp target/flowforge-flink-jobs-1.0.0.jar /output/flowforge-flink-jobs.jar &&
             echo 'Flink JARs built and placed in shared volume'"
    networks:
      - flowforge-net

  # ─── Ollama (Local LLM) ───
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && ollama pull phi3:mini && wait"]
    networks:
      - flowforge-net

networks:
  flowforge-net:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  localstack_data:
  flink_jars:
  maven_cache:
